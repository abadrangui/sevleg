<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>800 Robux бэлгийн карт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=block">
<style>
/* Layout: one A4 sheet, fold card. Top half = front (sky, coins, block hero). Bottom half = back, rotated 180° so it reads upright after folding on the middle line. */
:root {
  --sky-top: #6cc7fb;
  --sky-bottom: #c4ecff;
  --grass: #4cb944;
  --grass-dark: #3a9634;
  --dirt: #8b5a2b;
  --dirt-dark: #6f4520;
  --gold: #ffc83d;
  --gold-rim: #e09a00;
  --gold-shine: #fff1b8;
  --red: #e8453c;
  --ink: #1d2340;
  --paper: #ffffff;
  --cut: #9aa6bd;
  --font: "Rubik", "Arial Rounded MT Bold", Arial, sans-serif;
}
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet { width: 210mm; height: 297mm; position: relative; }
.half { position: absolute; left: 0; width: 210mm; height: 148.5mm; display: grid; place-items: center; }
.half.top { top: 0; }
.half.bottom { top: 148.5mm; }
.half.bottom .card { transform: rotate(180deg); }
.fold { position: absolute; top: 148.5mm; left: 8mm; right: 8mm; border-top: 0.35mm dashed var(--cut); }
.fold span { position: absolute; left: 50%; top: -2.6mm; transform: translateX(-50%); background: var(--paper); padding: 0 3mm; font-size: 7pt; color: var(--cut); font-weight: 500; }
.trim { position: absolute; inset: 0; pointer-events: none; }

.card { width: 184mm; height: 124mm; border-radius: 6mm; overflow: hidden; position: relative; border: 0.35mm solid var(--cut); }

/* FRONT */
.front { background: linear-gradient(var(--sky-top), var(--sky-bottom)); }
.front .label { position: absolute; top: 7mm; left: 9mm; font-weight: 700; font-size: 11pt; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper); background: var(--ink); padding: 1.2mm 3.5mm; border-radius: 1.5mm; }
.front .price { position: absolute; top: 5mm; right: 7mm; width: 22mm; height: 22mm; border-radius: 50%; background: var(--red); color: var(--paper); display: grid; place-items: center; font-weight: 900; font-size: 17pt; transform: rotate(10deg); box-shadow: 0 0.8mm 0 rgba(0,0,0,0.18); }
.front .hero { position: absolute; left: 7mm; bottom: 12mm; width: 44mm; }
.front .main { position: absolute; left: 54mm; right: 8mm; top: 20mm; display: grid; gap: 2.5mm; justify-items: center; }
.front .big { display: flex; align-items: center; gap: 3mm; font-weight: 900; color: var(--ink); line-height: 1; }
.front .big .num { font-size: 50pt; letter-spacing: -0.02em; -webkit-text-stroke: 0; text-shadow: 0 1mm 0 var(--paper); }
.front .big .word { font-size: 25pt; }
.front .coins { display: grid; grid-template-columns: repeat(4, 19mm); gap: 2.5mm 3mm; }
.front .coins svg { width: 19mm; height: 19mm; display: block; }
.front .sum { font-weight: 700; font-size: 13pt; color: var(--ink); background: rgba(255,255,255,0.75); border-radius: 2mm; padding: 1mm 4mm; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 12mm; display: flex; overflow: hidden; background: linear-gradient(var(--grass) 0 33.4%, var(--dirt) 33.4% 100%); }
.ground svg { height: 12mm; width: 12.15mm; margin-right: -0.15mm; display: block; flex: none; shape-rendering: crispEdges; }
.cloud { position: absolute; }

/* BACK */
.back { background: var(--paper); }
.back .inner { position: absolute; inset: 0 0 12mm 0; padding: 8mm 10mm 6mm; display: grid; grid-template-rows: auto 1fr auto auto; gap: 4mm; }
.back h2 { margin: 0; font-weight: 900; font-size: 20pt; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; align-items: start; }
.steps .s { display: grid; justify-items: center; text-align: center; gap: 2mm; }
.steps .s svg { width: 30mm; height: 30mm; display: block; }
.steps .n { width: 8mm; height: 8mm; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 900; font-size: 12pt; }
.steps .t { font-weight: 700; font-size: 11.5pt; line-height: 1.25; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 8mm; font-weight: 700; font-size: 11pt; }
.fields .f { display: flex; align-items: flex-end; gap: 2mm; }
.fields .f i { flex: 1; border-bottom: 0.35mm solid var(--ink); height: 5mm; }
.fields .code { grid-column: 1 / -1; }
.fields .code i { border: 0.35mm solid var(--ink); border-radius: 1.5mm; height: 9mm; }
.note { font-size: 7.6pt; font-weight: 500; color: #4b5470; line-height: 1.35; }

.front .logo { position: absolute; top: 8mm; left: 54mm; right: 8mm; margin: 0 auto; width: 70mm; display: block; }
.front .main { top: 25mm !important; gap: 2mm !important; }
.front .big img { width: 15mm; height: auto; }
.front .big .num { font-size: 44pt !important; }
.front .big .word { font-size: 22pt !important; }
.front .coins { grid-template-columns: repeat(4, 20mm) !important; gap: 1.5mm 4mm !important; }
.rc { display: grid; justify-items: center; gap: 0.5mm; }
.rc img { width: 14mm; height: auto; display: block; filter: drop-shadow(0 0.5mm 0 rgba(0,0,0,0.15)); }
.rc span { font-weight: 900; font-size: 11pt; color: var(--ink); background: rgba(255,255,255,0.8); border-radius: 1.2mm; padding: 0 1.8mm; }
.pile { position: relative; width: 30mm; height: 30mm; }
.pile img { position: absolute; width: 15mm; height: auto; }
.pile img:nth-child(1) { left: 7.5mm; top: 1mm; }
.pile img:nth-child(2) { left: 1mm; top: 13mm; }
.pile img:nth-child(3) { left: 14mm; top: 13mm; }
</style>
</head>
<body>
<div class="sheet">

  <!-- FRONT -->
  <div class="half top">
    <div class="card front">
      <svg class="cloud" style="left:9mm;top:20mm;width:26mm" viewBox="0 0 30 10"><rect x="4" y="3" width="22" height="7" fill="#ffffff"/><rect x="9" y="0" width="12" height="4" fill="#ffffff"/></svg>
      <svg class="cloud" style="left:30mm;top:31mm;width:15mm" viewBox="0 0 30 10"><rect x="4" y="3" width="22" height="7" fill="#ffffff"/><rect x="9" y="0" width="12" height="4" fill="#ffffff"/></svg>

      <div class="label">Бэлгийн карт</div>

      <!-- block hero (generic cube character) -->
      <svg class="hero" viewBox="0 0 44 70" aria-label="Шоо толгойтой хүү">
        <rect x="11" y="2" width="22" height="20" rx="1.5" fill="#f2c089"/>
        <rect x="11" y="2" width="22" height="6" fill="#5a3418"/>
        <rect x="16" y="11" width="3" height="4" fill="#1d2340"/>
        <rect x="25" y="11" width="3" height="4" fill="#1d2340"/>
        <path d="M16 17 Q22 21.5 28 17" stroke="#1d2340" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <rect x="8" y="23" width="28" height="22" rx="1" fill="#e8453c"/>
        <rect x="18" y="29" width="8" height="8" fill="#ffc83d"/>
        <rect x="1" y="7" width="7" height="20" rx="1" fill="#e8453c"/>
        <rect x="1" y="1" width="7" height="6.5" rx="1" fill="#f2c089"/>
        <rect x="36" y="23" width="7" height="20" rx="1" fill="#e8453c"/>
        <rect x="36" y="43" width="7" height="6" rx="1" fill="#f2c089"/>
        <rect x="10" y="46" width="11" height="22" rx="1" fill="#2c4a8f"/>
        <rect x="23" y="46" width="11" height="22" rx="1" fill="#2c4a8f"/>
      </svg>

      <img class="logo" src="assets/roblox-logo.svg" alt="Roblox">
      <div class="main">
        <div class="big"><img src="assets/robux.svg" alt=""><span class="num">800</span><span class="word">Robux</span></div>
        <div class="coins"><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div><div class="rc"><img src="assets/robux.svg" alt=""><span>100</span></div></div>
        <div class="sum">8 × 100 = 800</div>
      </div>

      <div class="ground" id="ground-front"></div>
    </div>
  </div>

  <div class="fold"><span>Энэ зураасаар нугална</span></div>

  <!-- BACK (rotated 180° for folding) -->
  <div class="half bottom">
    <div class="card back">
      <div class="inner">
        <h2>Яаж авах вэ?</h2>
        <div class="steps">
          <div class="s">
            <svg viewBox="0 0 60 60" aria-label="Карт">
              <rect x="6" y="14" width="48" height="32" rx="5" fill="#6cc7fb"/>
              <rect x="6" y="38" width="48" height="8" fill="#4cb944"/>
              <circle cx="40" cy="26" r="8" fill="#ffc83d" stroke="#e09a00" stroke-width="2"/>
              <rect x="12" y="20" width="16" height="5" rx="1" fill="#1d2340"/>
            </svg>
            <div class="n">1</div>
            <div class="t">Картаа аав, ээждээ өгнө</div>
          </div>
          <div class="s">
            <svg viewBox="0 0 60 60" aria-label="Таблет">
              <rect x="10" y="6" width="40" height="48" rx="5" fill="#1d2340"/>
              <rect x="14" y="11" width="32" height="36" rx="2" fill="#6cc7fb"/>
              <rect x="18" y="26" width="24" height="7" rx="1.5" fill="#ffffff"/>
              <rect x="20" y="28.5" width="3" height="2" fill="#1d2340"/><rect x="25" y="28.5" width="3" height="2" fill="#1d2340"/><rect x="30" y="28.5" width="3" height="2" fill="#1d2340"/><rect x="35" y="28.5" width="3" height="2" fill="#1d2340"/>
              <rect x="22" y="37" width="16" height="6" rx="3" fill="#4cb944"/>
              <circle cx="30" cy="50.5" r="1.6" fill="#6cc7fb"/>
            </svg>
            <div class="n">2</div>
            <div class="t">Хамтдаа таблет дээр оруулна</div>
          </div>
          <div class="s">
            <div class="pile"><img src="assets/robux.svg" alt=""><img src="assets/robux.svg" alt=""><img src="assets/robux.svg" alt=""></div>
            <div class="n">3</div>
            <div class="t">Тоглоомд 800 зоос гарна!</div>
          </div>
        </div>
        <div class="fields">
          <div class="f">Хэнд: <i></i></div>
          <div class="f">Хэнээс: <i></i></div>
          <div class="f code">Код: <i></i></div>
        </div>
        <p class="note">Том хүнд: Кодыг roblox.com/redeem хаягаар оруулна. Жинхэнэ картын кодыг дээрх нүдэнд бичнэ.</p>
      </div>
      <div class="ground" id="ground-back"></div>
    </div>
  </div>
</div>

<script>
// grass/dirt blocks along the bottom of both cards
var block = '<svg viewBox="0 0 12 12"><rect width="12" height="12" fill="#8b5a2b"/><rect width="12" height="4" fill="#4cb944"/><rect y="4" width="3" height="1.5" fill="#4cb944"/><rect x="7" y="4" width="2" height="2" fill="#4cb944"/><rect x="3" y="4" width="4" height="1" fill="#3a9634"/><rect x="2" y="8" width="2" height="2" fill="#6f4520"/><rect x="8" y="9" width="2" height="1.5" fill="#6f4520"/><rect x="5" y="7" width="1.5" height="1.5" fill="#a06a35"/></svg>';
["ground-front", "ground-back"].forEach(function (id) {
  document.getElementById(id).innerHTML = new Array(18).join(block);
});
</script>
</body>
</html>
